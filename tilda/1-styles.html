<style>
:root{--ink:#0b0908;--y:#fbfc7e;--pu:#5542e7;--pu2:#4635c9;--pu3:#2a1d9a;--pink:#ec187e;--cy:#00ffff;--ez:cubic-bezier(.22,1,.36,1);--pop:cubic-bezier(.34,1.56,.64,1);--z:1}
body{margin:0;overflow-x:clip}
#stage,#stage *{box-sizing:border-box}
#stage{color:var(--ink);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;background:var(--pu)}
#stage{width:1920px;zoom:var(--z);position:relative}
#stage section{position:relative;width:1920px;overflow:clip}
.L{position:absolute;display:block;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.g{position:absolute;left:0;top:0;width:0;height:0}
.tx{position:absolute;left:0;top:0;transform-origin:0 0;margin:0;font-kerning:normal;font-feature-settings:"kern" 1;cursor:text}
.tx span{font-synthesis:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0;white-space:nowrap}
canvas.gl{position:absolute;left:0;top:0;pointer-events:none;display:block}
button:focus-visible{outline:3px solid var(--y);outline-offset:5px}
::selection{background:rgba(251,252,126,.85);color:#2a1d9a}

/* buttons */
.cta{position:absolute;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:3.2px;
  font:700 22.44px/1.2 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:0;
  transition:transform .4s var(--ez),box-shadow .4s var(--ez),background-color .3s var(--ez)}
.cta.y{background:var(--y);color:var(--pu2);border:3.6px solid var(--y);box-shadow:8px 8px 0 var(--pu2)}
.cta.y:hover{transform:scale(1.05);box-shadow:10px 10px 0 var(--pu3)}
.cta.m{background:var(--y);color:#d3086a;border:1.6px solid #d3086a;box-shadow:0 0 0 rgba(0,0,0,0)}
.cta.m:hover{transform:scale(1.05);box-shadow:6px 6px 0 #a0004c}
.cta:active{transform:scale(.98)}

/* reveal helpers (only when JS animation is on) */
.anim .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ez),transform .9s var(--ez)}
.anim .rv.on{opacity:1;transform:none}
.anim .tl{opacity:0;transform:translateX(-46px);transition:opacity .9s var(--ez),transform 1s var(--ez)}
.anim .tl.r{transform:translateX(46px)}

.anim .pp{opacity:0;transform:scale(.5);transition:opacity .45s var(--ez),transform .8s var(--pop)}
.anim .pp.on{opacity:1;transform:none}

/* HERO */
#hero{height:1513px;background:var(--pu)}
.anim #hero .star{opacity:0;transform:translateY(-240px) rotate(-70deg) scale(.5);transform-origin:968px 146px;transition:transform 1.05s var(--pop),opacity .4s var(--ez)}
.anim #hero .star.on{opacity:1;transform:none}
#hero .star.glow img{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,209,2,.2))}50%{filter:drop-shadow(0 0 30px rgba(255,209,2,.7))}}
.anim #hero .arr img{clip-path:inset(-20% 100% -20% -20%);transition:clip-path .9s cubic-bezier(.45,.05,.3,1)}
.anim #hero .arr.rtl img{clip-path:inset(-20% -20% -20% 100%)}
.anim #hero .arr.on img{clip-path:inset(-20% -20% -20% -20%)}
.anim #hero .lab{opacity:0;transform:translateY(10px);transition:opacity .7s var(--ez) .25s,transform .8s var(--ez) .25s}

.anim #hero .pl{opacity:0;transform:translateY(48px) scale(.95);transition:opacity .7s var(--ez),transform .95s var(--pop)}
.anim #hero .pl.on{opacity:1;transform:none}

.flake{animation:flk 7s ease-in-out infinite}

.twk{animation:twk 2.8s ease-in-out infinite}

.zm{position:absolute;display:none;z-index:80;pointer-events:none;background:#f6f5f2 center/100% 100% no-repeat;box-shadow:0 2px 4px rgba(0,0,0,.4);

.chips{position:absolute;left:500px;top:492px;width:862px;height:41px}

.ftitle{position:absolute;left:191px;top:585px;width:1481px;text-align:center;font:600 33.34px/38.35px Montserrat,sans-serif;color:#000;margin:0}
.ff{position:absolute;top:669px;width:388px;height:80px}
.ff input{position:absolute;left:0;top:0;width:100%;height:80px;padding:0 10px;font:400 22.23px/26.7px Montserrat,sans-serif;color:#1e1611;background:transparent;border:0;border-bottom:1px solid #000;border-radius:0;outline:none}

.deco{position:absolute;pointer-events:none;display:block}
.done p{position:absolute;left:191px;width:1481px;text-align:center;margin:0}

@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}}

/* TABLE */
#tblw{background:var(--pink);overflow:visible}
#tst{position:sticky;top:0;width:1920px;overflow:clip;background:var(--pink)}
#tstrip{position:absolute;left:0;width:1920px;bottom:0;background:var(--cy)}
#tin{position:absolute;left:0;top:0;width:1920px;height:1268px;transform-origin:0 0}
#tin .ds,#tin .fd,#tin .end,#tin .arw,#tin .hd{will-change:opacity,transform}
.pl{position:absolute;background:#d3086a}
#tin .nxt,.mz .nxt{position:absolute;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;transition:transform .45s var(--ez),opacity .4s var(--ez)}
#tin .nxt img,.mz .nxt img{position:absolute;display:block;pointer-events:none}
#tin .nxt:hover,.mz .nxt:hover{transform:translateX(10px)}
#tin .nxt:focus-visible{outline:3px solid var(--y);outline-offset:6px}
#tin .nxt.off{opacity:0;pointer-events:none}
.mob #tin>.nxt{display:none}
#tin .end{opacity:0;transition:opacity .6s var(--ez),transform .6s var(--ez);transform:translateY(16px);pointer-events:none}
#tin .end.on{opacity:1;transform:none;pointer-events:auto}

/* BOARD */
#board{height:2354px;background:var(--cy) url(https://q-team-new-year-2027.vercel.app/img/v5/board2x.webp) 0 0/1920px 2354px no-repeat}
#board .bc{position:absolute;background-image:url(https://q-team-new-year-2027.vercel.app/img/v5/board2x.webp);background-size:1920px 2354px;background-repeat:no-repeat}
#board .rb{position:absolute;left:0;top:0;width:1920px;height:2354px;pointer-events:none}
#board .tape{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
#board .trk{position:absolute;display:flex;white-space:nowrap;font-family:Montserrat,sans-serif;font-weight:700;line-height:1;color:#1b1b1b;animation:tape 40s linear infinite}
#board .trk.rev{animation-direction:reverse}
#board .trk span{display:flex;flex:none;gap:var(--g);padding-right:var(--g)}
#board .trk b{font-weight:700;white-space:nowrap;flex:none}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#board .thr{position:absolute;left:0;top:0;width:1920px;height:2354px;pointer-events:none;max-width:none}
#board .hv,#board .ly{position:absolute}
#board .hv img,#board .ly img{display:block;width:100%;height:100%;pointer-events:none}
#board .hv{transition:transform .5s var(--ez);transform-origin:50% 30%}
#board .hv:hover{transform:rotate(var(--r))}
#board .bc{border:0;padding:0;cursor:pointer;font:700 22.4px/26.88px Montserrat,sans-serif;text-transform:uppercase;color:#0b0908;transition:transform .4s var(--ez)}
#board .bc:hover{transform:scale(1.05)}
#board .bc:active{transform:scale(.98)}


/* ===== MOBILE (< 1024px): 780-unit canvas = the 390 px Figma mobile frames (Page 4) x2.
   Every section gets its own Figma-ordered layers in .mz (drawn in Figma units, scaled x2). ===== */
.mz{position:absolute;left:0;top:0;width:390px;height:0;transform:scale(2);transform-origin:0 0;display:none;pointer-events:none}
.mob .mz{display:block}
.mz p,.mz img,.mz div,.mz button{position:absolute;margin:0}
.mz img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.mz .t{white-space:pre-wrap;font-family:Montserrat,sans-serif;font-kerning:normal}
.mz .cv{font-family:Caveat,cursive}
.mz .nw{white-space:nowrap}
.mz .rt{transform-origin:50% 50%}
.mz .rough{filter:url(#qrough)}
.mz .mlg{left:0;top:0;width:5865.74px;height:39.03px;animation:mlg 70s linear infinite}
@keyframes mlg{to{transform:translateX(-2932.87px)}}

.mz button:active{transform:scale(.97)}
.mob #stage,.mob #stage section{width:780px}
.mob #hero{height:2176px}

.mob .chips span{position:static;width:260.24px;height:41.2px;border-width:2.016px;border-radius:3px;font-size:16px;line-height:19px}
.mob .ftitle{left:40px;top:738.36px;width:700px;font-size:39.77px;line-height:45.7px}
.ftitle .pk{color:#d3086a}
.mob .ff{left:106px!important;width:568px;height:83.8px}
.mob .ff:nth-child(1){top:822.44px}.mob .ff:nth-child(2){top:946.44px}.mob .ff:nth-child(3){top:1070.44px}

</style>
