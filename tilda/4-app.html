/* ================= tiny WebGL sprite renderer ================= */

{

let treeDirty=true;
// hover zoom: a crisp HTML copy of the photo pops above everything
let hovO=null;const ZF0=4.2,zf=()=>MOB?4.6:ZF0,TOFF=()=>MOB?280:0,ZW=()=>MOB?780:1920,ZH=()=>MOB?2176:1513;

  const lx=dx*c-dy*s,ly=dx*s+dy*c;if(Math.abs(lx)<=o.w/2&&Math.abs(ly)<=o.h/2)return o;}return null;}

hero.addEventListener('mousemove',e=>{if(!introDone||MOB)return;const {r,k}=kOf(hero);const x=(e.clientX-r.left)/k,y=(e.clientY-r.top)/k;

  setHover(hitTree(x,y));});
hero.addEventListener('mouseleave',()=>setHover(null));
// click (desktop) / tap (phone): enlarge a photo, tap again or anywhere else to put it back
hero.addEventListener('click',e=>{if(!introDone||e.target.closest('button'))return;const {r,k}=kOf(hero);

{let armed=false;const arm=()=>{if(armed||scrollY<30)return;armed=true;removeEventListener('scroll',arm);

// hand-drawn (wiggly) outlines, generated as vectors like Figma's dynamic stroke
